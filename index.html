<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Wealth Boost</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one calm column (max 760px). Status strip -> what needs attention -> portfolio -> goal; detail lives behind tabs. */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --sunk:#E8EEEC; --fg:#15211D; --muted:#5B6B66; --line:#D5DFDB;
  --accent:#0F6B5C; --accent-soft:#D6EBE6;
  --good:#2E7D4F; --warn:#A8660F; --bad:#B3261E; --info:#3B5BA5;
  --band1:rgba(15,107,92,.12); --band2:rgba(15,107,92,.24);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#141E1B; --sunk:#1B2824; --fg:#E3ECE8; --muted:#93A59F; --line:#2A3A35;
  --accent:#5CC2AD; --accent-soft:#1D3A33; --good:#6CC28E; --warn:#E3A84F; --bad:#F08A80; --info:#8FA9EC;
  --band1:rgba(92,194,173,.14); --band2:rgba(92,194,173,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#141E1B; --sunk:#1B2824; --fg:#E3ECE8; --muted:#93A59F; --line:#2A3A35;
  --accent:#5CC2AD; --accent-soft:#1D3A33; --good:#6CC28E; --warn:#E3A84F; --bad:#F08A80; --info:#8FA9EC;
  --band1:rgba(92,194,173,.14); --band2:rgba(92,194,173,.28); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.55rem} h2{font-size:1.15rem} h3{font-size:1rem}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.82rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
nav.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font:600 .85rem var(--f-body);color:var(--muted);background:none;border:1px solid transparent;border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);background:var(--surface);border-color:var(--line)}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sample{background:var(--warn);color:var(--surface);font-weight:600;padding:8px 12px;border-radius:8px;font-size:.85rem}
.status{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:6px}
.s-OK{background:var(--good)} .s-DEGRADED{background:var(--warn)} .s-FAILED{background:var(--bad)}
.status .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted)}
section{display:grid;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 16px;position:relative;overflow:hidden}
.item::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--line)}
.sev3::before,.sev2::before{background:var(--bad)} .sev1::before{background:var(--warn)} .sev0::before{background:var(--info)}
.item p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
details>summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.85rem;margin-top:8px;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"\25B8  "} details[open]>summary::before{content:"\25BE  "}
.why{margin-top:8px;padding:10px 12px;background:var(--sunk);border-radius:8px;font-size:.86rem;display:grid;gap:8px}
.calm{background:var(--accent-soft);border-radius:12px;padding:16px;display:grid;gap:4px}
.calm strong{font-family:var(--f-display);font-size:1.1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi .v{font-family:var(--f-data);font-size:1.35rem;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.78rem;color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:baseline}
.gauge{position:relative;height:28px}
.gauge .track{position:absolute;inset:11px 0;background:var(--sunk);border-radius:3px}
.gauge .tol{position:absolute;top:8px;height:12px;background:var(--band2);border-radius:3px}
.gauge .mark{position:absolute;top:2px;width:3px;height:24px;border-radius:2px;background:var(--fg)}
.chip{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.c-CANDIDATE{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.c-REVIEW_SELL{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.c-WATCH{border-color:var(--accent);color:var(--accent)}
.c-NO_DATA{border-style:dashed;color:var(--muted)}
.rows{display:grid}
.row{display:grid;grid-template-columns:minmax(64px,auto) 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.score{height:8px;background:var(--sunk);border-radius:4px;position:relative}
.score .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.score .fill{position:absolute;top:0;bottom:0;border-radius:4px}
.tbl{overflow-x:auto} table{border-collapse:collapse;width:100%;font-size:.84rem} th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left} th{font-weight:600;color:var(--muted);font-size:.75rem}
svg text{fill:var(--muted);font:11px var(--f-body)}
.lock{max-width:420px;margin:12vh auto 0;display:grid;gap:12px}
.lock input{font:1rem var(--f-body);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn{font:600 .95rem var(--f-body);padding:10px 14px;border-radius:10px;border:0;background:var(--accent);color:var(--surface);cursor:pointer}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--line)}
.err{color:var(--bad);font-size:.85rem}
.drv{display:grid;grid-template-columns:minmax(120px,1.2fr) 1fr 56px;gap:8px;align-items:center}
@media (prefers-reduced-motion:no-preference){.item,.card{transition:border-color .15s}}

.hero{font-family:var(--f-display);font-size:1.6rem;font-weight:700;line-height:1.2;text-wrap:balance;margin:6px 0 0}
.sub{color:var(--muted);font-size:.9rem}
.big{font-family:var(--f-data);font-size:2rem;font-variant-numeric:tabular-nums;line-height:1.1}
.line{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:999px}
.p-good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.p-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.p-neutral{background:var(--sunk);color:var(--muted)}
.p-bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.progress{height:14px;border-radius:7px;background:var(--sunk);overflow:hidden;position:relative}
.progress span{display:block;height:100%;background:var(--accent)}
.idea{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;background:var(--surface)}
.idea h3{font-size:1.02rem}
.plan3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plan3>div{background:var(--sunk);border-radius:8px;padding:8px 10px}
.plan3 .k{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.plan3 .v{font-family:var(--f-data);font-variant-numeric:tabular-nums}
@media (max-width:460px){.plan3{grid-template-columns:1fr}}
.list{display:grid;gap:6px}
.list .li{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.list .li>span:first-child{min-width:0}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:600 .88rem var(--f-body);cursor:pointer}
</style>

<div class="wrap" id="app"><div class="lock" id="lock" hidden>
  <h1>Wealth Boost</h1>
  <p class="muted">This dashboard is encrypted. Enter your passphrase to open it on this device.</p>
  <label for="pw" class="eyebrow">Passphrase</label>
  <input id="pw" type="password" autocomplete="current-password">
  <label class="small muted"><input id="remember" type="checkbox" checked> Remember on this device</label>
  <button class="btn" id="unlock">Open dashboard</button>
  <div class="err" id="lockerr" hidden></div>
</div></div>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isNum=x=>typeof x==="number"&&isFinite(x);
let D=null, CUR="GBP";
const sym=c=>({GBP:"£",EUR:"€",USD:"$"}[c]||"");
const money=(x,d=0)=>isNum(x)?(x<0?"-":"")+sym(CUR)+Math.abs(x).toLocaleString("en-GB",{maximumFractionDigits:d,minimumFractionDigits:d}):"–";
const usd=(x)=>isNum(x)?"$"+x.toLocaleString("en-GB",{maximumFractionDigits:2,minimumFractionDigits:2}):"–";
const big=x=>!isNum(x)?"–":Math.abs(x)>=1e6?sym(CUR)+(x/1e6).toFixed(2)+"M":Math.abs(x)>=1e4?sym(CUR)+Math.round(x/1e3)+"k":money(x);
const pct=(x,d=0)=>isNum(x)?(x*100).toFixed(d)+"%":"–";
const spct=(x,d=1)=>isNum(x)?(x>0?"+":"")+(x*100).toFixed(d)+"%":"–";
const sgn=(x,d=2)=>isNum(x)?(x>0?"+":"")+x.toFixed(d):"–";
const ago=iso=>{if(!iso)return"never";const h=(Date.now()-Date.parse(iso))/36e5;return h<1?"under an hour ago":h<48?Math.round(h)+" hours ago":Math.round(h/24)+" days ago"};
const nice=d=>{if(!d)return"–";const t=new Date(d+"T12:00:00Z");return t.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})};
const mon=d=>{if(!d)return"–";const t=new Date(d+"T12:00:00Z");return t.toLocaleDateString("en-GB",{month:"short",year:"numeric"})};
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const nm=(name,t)=>name&&name.toUpperCase()!==String(t).toUpperCase()?`${esc(name)} <span class="muted">(${esc(t)})</span>`:esc(t);
const LBL={tsmom_12_1:"12-month trend",trend_200:"above its 200-day average",high_52w:"close to its 12-month high",rel_strength:"beating the US market (3 months)",volume_attention:"unusual buying volume",ret_20d:"last month's move",gross_profitability:"profitability",revenue_growth:"sales growth",fcf_margin:"cash generation",earnings_yield:"cheapness (profits vs price)",leverage:"low debt",earnings_trend:"profit trend"};
const level=s=>!isNum(s)?"no data":s>=0.6?"very strong":s>=0.3?"strong":s>0.1?"mildly positive":s>-0.1?"neutral":s>-0.3?"mildly negative":s>-0.6?"weak":"very weak";

async function decrypt(env,keyRaw){
  const key=await crypto.subtle.importKey("raw",keyRaw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(env.iv)},key,b64(env.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function derive(pw,env){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64(env.salt),iterations:env.iter,hash:"SHA-256"},base,256));
}
async function boot(){
  const env=JSON.parse($("#payload").textContent);
  if(!env.enc){D=env;return render()}
  const saved=store.get("wb.key."+env.salt);
  if(saved){try{D=await decrypt(env,b64(saved));return render()}catch(e){store.del("wb.key."+env.salt)}}
  $("#lock").hidden=false;
  const go=async()=>{const err=$("#lockerr");err.hidden=true;$("#unlock").textContent="Opening…";
    try{const k=await derive($("#pw").value,env);D=await decrypt(env,k);
      if($("#remember").checked)store.set("wb.key."+env.salt,btoa(String.fromCharCode(...k)));render()}
    catch(e){err.textContent="That passphrase did not open the dashboard. Check it and try again.";err.hidden=false;$("#unlock").textContent="Open dashboard"}};
  $("#unlock").onclick=go;$("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
}

const TABS=[["today","Today"],["score","Scorecard"],["ideas","Trade ideas"],["goal","Goal"],["signals","All signals"],["how","How it works"]];
let tab=(location.hash||"").slice(1);
function go(t){tab=t;store.set("wb.tab",tab);render();window.scrollTo&&window.scrollTo(0,0)}
function render(){
  CUR=(D.portfolio&&D.portfolio.currency)||D.params.base_currency||"GBP";
  if(!TABS.some(t=>t[0]===tab))tab=store.get("wb.tab")||"today";
  const h=D.health,r=D.run;
  const dot=h.status==="OK"?"s-OK":h.status==="DEGRADED"?"s-DEGRADED":"s-FAILED";
  $("#app").innerHTML=`
  <header class="top"><div class="brand"><h1>Wealth Boost</h1>
    <span class="small muted"><span class="dot ${dot}" style="display:inline-block;margin:0 6px 0 0;vertical-align:middle"></span>${h.status==="OK"?"Up to date":"Data issue"} · prices to ${nice(r.as_of)} · updated ${ago(r.finished_utc)}</span></div>
    <nav class="tabs" role="tablist">${TABS.map(([k,l])=>`<button role="tab" data-t="${k}" aria-selected="${k===tab}">${l}</button>`).join("")}</nav>
  </header>
  ${D.sample?`<div class="sample">SAMPLE DATA. Synthetic prices and invented holdings used to test the system. Nothing here is real.</div>`:""}
  <main id="view" class="wrap"></main>
  <p class="small muted">Decision support only. Nothing here places orders; every decision is yours.</p>`;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>go(b.dataset.t));
  ({today,score,ideas,goal,signals,how})[tab]();
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
}

/* ================= TODAY ================= */
function today(){
  const A=(D.attention||[]).filter(i=>i.severity>=1), P=D.portfolio||{};
  const n=A.length;
  let html=`<section><div class="hero">${n?`${n} thing${n>1?"s":""} to look at today.`:"Nothing needs doing today."}</div>
  <div class="sub">${n?"Below, most important first. Tap “Why” for the reasoning.":"Your plan is on track to run as set. Keep depositing."}</div></section>`;
  if(n)html+=`<section>${A.map(attn).join("")}</section>`;
  html+=moneyCard(P)+scoreCard()+goalCard()+depositCard()+ideasPreview();
  const ch=(D.changes||[]).filter(c=>!/^No material change/.test(c)&&!/^First run/.test(c));
  if(ch.length)html+=`<section><div class="eyebrow">Changed since the last update</div><div class="card small">${ch.map(c=>`<div>${esc(c)}</div>`).join("")}</div></section>`;
  $("#view").innerHTML=html;
}
function attn(i){
  let why="";
  const t=i.ticker||(i.tickers||[])[0];const a=t&&D.assets.find(x=>x.ticker===t);
  if(a)why=whyAsset(a);
  if(i.kind==="health")why=`<div class="why">${(D.health.issues||[]).map(x=>`<div><strong>${esc(x.title)}</strong><br><span class="muted">${esc(x.detail)}</span></div>`).join("")}</div>`;
  if(!why)why=`<div class="why">${esc(i.detail)}<div class="muted small">These limits are your own rules (editable in the workbook). They prompt a review, never an automatic trade.</div></div>`;
  return `<div class="item sev${i.severity}"><strong>${esc(i.title)}</strong><p>${esc(i.detail)}</p><details><summary>Why</summary>${why}</details></div>`;
}
function moneyCard(P){
  if(!P.available)return `<section><div class="eyebrow">Your money</div><div class="card"><div>Your Trading 212 accounts are not connected yet.</div><div class="small muted">${esc(P.reason||"")}</div></div></section>`;
  const pf=P.performance||{},W=P.weights||{};
  const gain=pf.available?P.total-pf.net_deposits:null;
  const behind=pf.available&&isNum(pf.benchmark_xirr)&&pf.xirr<pf.benchmark_xirr;
  const bonds=(P.positions||[]).filter(x=>x.role==="defensive"&&x.ticker!=="CASH").reduce((s,x)=>s+x.weight,0);
  const hy=(P.positions||[]).filter(x=>/high yield/i.test(x.name||"")).reduce((s,x)=>s+x.weight,0);
  return `<section><div class="eyebrow">Your money</div><div class="card">

function lineChart(series,labels,colors,fmt){
  const n=Math.max(...series.map(s=>s.length));if(n<2)return `<div class="small muted">The chart appears after a few days of records.</div>`;
  const W=640,H=200,L=56,R=10,T=10,B=22;const all=series.flat().map(p=>p[1]).filter(isNum);
  let lo=Math.min(...all),hi=Math.max(...all);if(hi===lo){hi=hi*1.01+1;lo=lo*0.99-1}
  const x=i=>L+(W-L-R)*i/(n-1),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const ticks=[0,.5,1].map(t=>lo+t*(hi-lo));const d=series[0];
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(labels.join(" vs "))}">
  ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${fmt(t)}</text>`).join("")}
  ${series.map((s,j)=>`<polyline points="${s.map((p,i)=>`${x(i+(n-s.length))},${y(p[1])}`).join(" ")}" fill="none" stroke="${colors[j]}" stroke-width="2"/>`).join("")}
  <text x="${L}" y="${H-5}">${esc(nice(d[0][0]))}</text><text x="${W-R}" y="${H-5}" text-anchor="end">${esc(nice(d[d.length-1][0]))}</text></svg></div>
  <div class="legend">${labels.map((l,j)=>`<span><i style="background:${colors[j]}"></i>${esc(l)}</span>`).join("")}</div>`;
}

    L.push(`<li>Price is <strong>${pct(-d.drawdown_52w)}</strong> below its 12-month high.</li>`);

function fanChart(g,compact){
  const f=(g.monte_carlo||{}).fan||[];if(f.length<2)return"";
  const ya=((g.your_assumptions||{}).line||[]).slice(0,f.length);
  const goalV=g.recommendation.stated_goal,W=640,H=compact?190:260,L=56,R=10,T=10,B=24;
  const ymaxData=Math.max(...f.map(r=>r.p90),...ya.map(r=>r.value));
  const ymax=Math.max(ymaxData*1.08,Math.min(goalV*1.05,ymaxData*4));
  const x=i=>L+(W-L-R)*i/(f.length-1),y=v=>T+(H-T-B)*(1-Math.min(v,ymax)/ymax);
  const band=(a,b)=>f.map((r,i)=>`${x(i)},${y(r[a])}`).join(" ")+" "+f.map((r,i)=>`${x(f.length-1-i)},${y(f[f.length-1-i][b])}`).join(" ");
  const ticks=[0,.25,.5,.75,1].map(t=>t*ymax);
  const yrs=f.map((r,i)=>[i,r.date]).filter(([i,d])=>d.slice(5,7)==="12");
  const goalIn=goalV<=ymax;
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Projected portfolio value range">
  ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${big(t)}</text>`).join("")}
  <polygon points="${band("p90","p10")}" fill="var(--band1)"/><polygon points="${band("p75","p25")}" fill="var(--band2)"/>
  <polyline points="${f.map((r,i)=>`${x(i)},${y(r.p50)}`).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.2"/>
  ${ya.length?`<polyline points="${ya.map((r,i)=>`${x(i)},${y(r.value)}`).join(" ")}" fill="none" stroke="var(--warn)" stroke-width="1.8" stroke-dasharray="5 4"/>`:""}
  ${goalIn?`<line x1="${L}" x2="${W-R}" y1="${y(goalV)}" y2="${y(goalV)}" stroke="var(--bad)" stroke-dasharray="3 3"/><text x="${W-R}" y="${y(goalV)-5}" text-anchor="end" style="fill:var(--bad)">goal ${big(goalV)}</text>`:`<text x="${W-R}" y="${T+10}" text-anchor="end" style="fill:var(--bad)">goal ${big(goalV)} is far above this scale</text>`}
  <circle cx="${x(f.length-1)}" cy="${y(f[f.length-1].p50)}" r="3.5" fill="var(--accent)"/>
  ${yrs.map(([i,d])=>`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${d.slice(0,4)}</text>`).join("")}
  </svg></div>`;
}

/* ================= ALL SIGNALS (advanced) ================= */
function whyAsset(a){
  const e=a.explain||{};
  const dr=(e.drivers||[]).filter(d=>d.weight>0).map(d=>{
    const s=d.signal;const w=isNum(s)?Math.abs(s)*50:0;
    return `<div class="drv"><span class="small">${esc(LBL[d.name]||d.name.replace(/_/g," "))}</span>
    <div class="score"><span class="mid"></span>${isNum(s)?`<span class="fill" style="left:${s<0?50-w:50}%;width:${w}%;background:${s<0?"var(--bad)":"var(--good)"}"></span>`:""}</div>
    <span class="num small">${level(s)}</span></div>`}).join("");
  return `<div class="why"><div><strong>${nm(a.name,a.ticker)}</strong>: ${esc(a.label_text)}. <span class="muted small">${esc(a.label_reason||"")}</span></div>
    ${a.buy_as?`<div class="small">In the UK, buy it as ${nm(a.buy_as_name||a.buy_as,a.buy_as)}. Check it exists in Trading 212 first.</div>`:""}
    <div class="small">Overall signal: <strong>${level(e.composite)}</strong>, stronger than ${isNum(e.percentile)?pct(e.percentile):"–"} of the assets tracked.</div>
    ${dr}<div class="small muted">Price data to ${nice(e.data?.last_price_date)}. ${a.fund_note?esc(a.fund_note):""}</div></div>`;
}
function signals(){
  const order={CANDIDATE:0,REVIEW_SELL:1,HOLD:2,WATCH:3,CONFLICT:4,NONE:5,NO_DATA:6};
  const as=D.assets.slice().sort((a,b)=>(order[a.label]-order[b.label])||((b.composite??-9)-(a.composite??-9)));
  $("#view").innerHTML=`<section><div class="hero">All signals</div><div class="sub">Funds and shares tracked for your long-term money, strongest first. Bars run from weak (left) to strong (right). Tap a row for why.</div>
  <div class="card rows">${as.map(a=>{const s=a.composite,w=isNum(s)?Math.abs(s)*50:0;return `
  <details><summary style="list-style:none;color:inherit;margin:0;font-weight:400"><div class="row">
    <div style="min-width:0"><strong>${esc(a.name||a.ticker)}</strong>${a.held?` <span class="chip">you own</span>`:""}<div class="small muted">${esc(a.ticker)}</div></div>
    <div class="score"><span class="mid"></span>${isNum(s)?`<span class="fill" style="left:${s<0?50-w:50}%;width:${w}%;background:${s<0?"var(--bad)":"var(--accent)"}"></span>`:""}</div>
    <span class="chip c-${a.label}">${esc(a.label_text)}</span></div></summary>${whyAsset(a)}</details>`}).join("")}</div></section>`;
}

/* ================= HOW IT WORKS ================= */
function how(){
  const al=D.allocation,bt=(D.validation||{}).backtest||{},vd=(D.validation||{}).verdict||[],h=D.health,src=D.sources||[];
  const fails=src.filter(s=>!s.ok||s.from_cache);
  $("#view").innerHTML=`<section><div class="hero">How it works</div><div class="sub">The machinery behind the Today page, for when you want to check it.</div></section>
  <section><div class="eyebrow">Data health</div><div class="card small">
  ${(h.issues||[]).length?h.issues.map(i=>`<div><strong>${esc(i.title)}</strong><br><span class="muted">${esc(i.detail)}</span></div>`).join(""):"<div>All data arrived fresh.</div>"}
  <div class="muted">${src.length} data sources this run${fails.length?`; ${fails.length} failed or served from cache: ${fails.map(s=>esc(s.key)).slice(0,8).join(", ")}`:""}. Run ${esc(D.run.run_id)}, model version ${D.run.config_version}.</div></div></section>
  <section><div class="eyebrow">Shares vs bonds target</div><div class="card small">
  <div><strong>Target ${pct(al.target_risk)} in shares</strong></div>
  ${al.parts.map(p=>`<div class="drv"><span>${esc(p[0])}</span><span></span><span class="num">${pct(p[1],1)}</span></div>`).join("")}
  <div class="muted">The economic outlook (inflation, rates, jobs, credit) only nudges this by a capped amount, because macro timing has weak evidence (Welch & Goyal 2008).</div></div></section>
  <section><div class="eyebrow">Does the fund signal work? (2008 to today)</div><div class="card">
  ${vd.map(v=>`<div class="small"><strong>${esc(v)}</strong></div>`).join("")}
  ${bt.available?`<div class="tbl"><table><tr><th>Approach</th><th>Yearly</th><th>Worst fall</th></tr>${bt.results.map(r=>`<tr><td>${esc(r.strategy)}</td><td class="num">${pct(r.full.cagr,1)}</td><td class="num">${pct(r.full.max_dd)}</td></tr>`).join("")}</table></div>`:""}
  </div></section>
  <section><div class="eyebrow">Changing the rules</div><div class="card small">Every number the tool uses is in the model workbook (yellow cells). Edit, upload it to the repo's inbox folder, and the next update uses it. Model version ${D.run.config_version}: ${esc(D.run.config_reason)}</div></section>`;
}
boot().catch(e=>{$("#app").innerHTML=`<div class="card">The dashboard could not load: ${esc(e.message)}</div>`});
</script>
</body></html>
