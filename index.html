<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Wealth Boost</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one calm column (max 760px). Status strip -> what needs attention -> portfolio -> goal; detail lives behind tabs. */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --sunk:#E8EEEC; --fg:#15211D; --muted:#5B6B66; --line:#D5DFDB;
  --accent:#0F6B5C; --accent-soft:#D6EBE6;
  --good:#2E7D4F; --warn:#A8660F; --bad:#B3261E; --info:#3B5BA5;
  --band1:rgba(15,107,92,.12); --band2:rgba(15,107,92,.24);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#141E1B; --sunk:#1B2824; --fg:#E3ECE8; --muted:#93A59F; --line:#2A3A35;
  --accent:#5CC2AD; --accent-soft:#1D3A33; --good:#6CC28E; --warn:#E3A84F; --bad:#F08A80; --info:#8FA9EC;
  --band1:rgba(92,194,173,.14); --band2:rgba(92,194,173,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#141E1B; --sunk:#1B2824; --fg:#E3ECE8; --muted:#93A59F; --line:#2A3A35;
  --accent:#5CC2AD; --accent-soft:#1D3A33; --good:#6CC28E; --warn:#E3A84F; --bad:#F08A80; --info:#8FA9EC;
  --band1:rgba(92,194,173,.14); --band2:rgba(92,194,173,.28); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.55rem} h2{font-size:1.15rem} h3{font-size:1rem}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.82rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
nav.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font:600 .85rem var(--f-body);color:var(--muted);background:none;border:1px solid transparent;border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);background:var(--surface);border-color:var(--line)}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sample{background:var(--warn);color:var(--surface);font-weight:600;padding:8px 12px;border-radius:8px;font-size:.85rem}
.status{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:6px}
.s-OK{background:var(--good)} .s-DEGRADED{background:var(--warn)} .s-FAILED{background:var(--bad)}
.status .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted)}
section{display:grid;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 16px;position:relative;overflow:hidden}
.item::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--line)}
.sev3::before,.sev2::before{background:var(--bad)} .sev1::before{background:var(--warn)} .sev0::before{background:var(--info)}
.item p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
details>summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.85rem;margin-top:8px;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"\25B8  "} details[open]>summary::before{content:"\25BE  "}
.why{margin-top:8px;padding:10px 12px;background:var(--sunk);border-radius:8px;font-size:.86rem;display:grid;gap:8px}
.calm{background:var(--accent-soft);border-radius:12px;padding:16px;display:grid;gap:4px}
.calm strong{font-family:var(--f-display);font-size:1.1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi .v{font-family:var(--f-data);font-size:1.35rem;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.78rem;color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:baseline}
.gauge{position:relative;height:28px}
.gauge .track{position:absolute;inset:11px 0;background:var(--sunk);border-radius:3px}
.gauge .tol{position:absolute;top:8px;height:12px;background:var(--band2);border-radius:3px}
.gauge .mark{position:absolute;top:2px;width:3px;height:24px;border-radius:2px;background:var(--fg)}
.chip{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.c-CANDIDATE{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.c-REVIEW_SELL{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.c-WATCH{border-color:var(--accent);color:var(--accent)}
.c-NO_DATA{border-style:dashed;color:var(--muted)}
.rows{display:grid}
.row{display:grid;grid-template-columns:minmax(64px,auto) 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.score{height:8px;background:var(--sunk);border-radius:4px;position:relative}
.score .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.score .fill{position:absolute;top:0;bottom:0;border-radius:4px}
.tbl{overflow-x:auto} table{border-collapse:collapse;width:100%;font-size:.84rem} th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left} th{font-weight:600;color:var(--muted);font-size:.75rem}
svg text{fill:var(--muted);font:11px var(--f-body)}
.lock{max-width:420px;margin:12vh auto 0;display:grid;gap:12px}
.lock input{font:1rem var(--f-body);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn{font:600 .95rem var(--f-body);padding:10px 14px;border-radius:10px;border:0;background:var(--accent);color:var(--surface);cursor:pointer}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--line)}
.err{color:var(--bad);font-size:.85rem}
.drv{display:grid;grid-template-columns:minmax(120px,1.2fr) 1fr 56px;gap:8px;align-items:center}
@media (prefers-reduced-motion:no-preference){.item,.card{transition:border-color .15s}}
</style>

  <p class="muted">This dashboard is encrypted. Enter your passphrase to open it on this device.</p>

  <input id="pw" type="password" autocomplete="current-password">
  <label class="small muted"><input id="remember" type="checkbox" checked> Remember on this device</label>
  <button class="btn" id="unlock">Open dashboard</button>
  <div class="err" id="lockerr" hidden></div>
</div></div>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isNum=x=>typeof x==="number"&&isFinite(x);
let D=null, CUR="GBP";
const sym=c=>({GBP:"£",EUR:"€",USD:"$"}[c]||"");
const money=(x,d=0)=>isNum(x)?(x<0?"-":"")+sym(CUR)+Math.abs(x).toLocaleString("en-GB",{maximumFractionDigits:d,minimumFractionDigits:d}):"–";
const big=x=>!isNum(x)?"–":Math.abs(x)>=1e6?sym(CUR)+(x/1e6).toFixed(2)+"M":Math.abs(x)>=1e4?sym(CUR)+Math.round(x/1e3)+"k":money(x);
const pct=(x,d=0)=>isNum(x)?(x*100).toFixed(d)+"%":"–";
const spct=(x,d=1)=>isNum(x)?(x>0?"+":"")+(x*100).toFixed(d)+"%":"–";
const sgn=(x,d=2)=>isNum(x)?(x>0?"+":"")+x.toFixed(d):"–";
const ago=iso=>{if(!iso)return"never";const h=(Date.now()-Date.parse(iso))/36e5;return h<1?"under an hour ago":h<48?Math.round(h)+" h ago":Math.round(h/24)+" days ago"};
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

async function decrypt(env,keyRaw){
  const key=await crypto.subtle.importKey("raw",keyRaw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(env.iv)},key,b64(env.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function derive(pw,env){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64(env.salt),iterations:env.iter,hash:"SHA-256"},base,256));
}
async function boot(){
  const env=JSON.parse($("#payload").textContent);
  if(!env.enc){D=env;return render()}
  const saved=store.get("wb.key."+env.salt);
  if(saved){try{D=await decrypt(env,b64(saved));return render()}catch(e){store.del("wb.key."+env.salt)}}
  $("#lock").hidden=false;
  const go=async()=>{const err=$("#lockerr");err.hidden=true;$("#unlock").textContent="Opening…";
    try{const k=await derive($("#pw").value,env);D=await decrypt(env,k);
      if($("#remember").checked)store.set("wb.key."+env.salt,btoa(String.fromCharCode(...k)));render()}
    catch(e){err.textContent="That passphrase did not open the dashboard. Check it and try again.";err.hidden=false;$("#unlock").textContent="Open dashboard"}};
  $("#unlock").onclick=go;$("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
}

    <span class="num small">${isNum(s)?sgn(s):"n/a"}</span></div>`}).join("");
  return `<div class="why">
    <div><strong>${esc(a.ticker)}</strong> · ${esc(a.label_text)} <span class="muted small">(${esc(a.label_reason||"")})</span></div>

function fanChart(g,compact){
  const f=(g.monte_carlo||{}).fan||[];if(f.length<2)return"";
  const ya=((g.your_assumptions||{}).line||[]).slice(0,f.length);
  const goalV=g.recommendation.stated_goal,W=640,H=compact?190:260,L=56,R=10,T=10,B=24;
  const ymaxData=Math.max(...f.map(r=>r.p90));
  const ymax=Math.max(ymaxData*1.08,Math.min(goalV*1.05,ymaxData*4));
  const x=i=>L+(W-L-R)*i/(f.length-1),y=v=>T+(H-T-B)*(1-Math.min(v,ymax)/ymax);
  const band=(a,b)=>f.map((r,i)=>`${x(i)},${y(r[a])}`).join(" ")+" "+f.map((r,i)=>`${x(f.length-1-i)},${y(f[f.length-1-i][b])}`).join(" ");
  const ticks=[0,.25,.5,.75,1].map(t=>t*ymax);
  const yrs=f.map((r,i)=>[i,r.date]).filter(([i,d])=>d.slice(5,7)==="12");
  const goalIn=goalV<=ymax;
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Projected portfolio value range">
  ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${big(t)}</text>`).join("")}
  <polygon points="${band("p90","p10")}" fill="var(--band1)"/><polygon points="${band("p75","p25")}" fill="var(--band2)"/>
  <polyline points="${f.map((r,i)=>`${x(i)},${y(r.p50)}`).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.2"/>
  ${ya.length?`<polyline points="${ya.map((r,i)=>`${x(i)},${y(r.value)}`).join(" ")}" fill="none" stroke="var(--warn)" stroke-width="1.8" stroke-dasharray="5 4"/>`:""}
  ${goalIn?`<line x1="${L}" x2="${W-R}" y1="${y(goalV)}" y2="${y(goalV)}" stroke="var(--bad)" stroke-dasharray="3 3"/><text x="${W-R}" y="${y(goalV)-5}" text-anchor="end" style="fill:var(--bad)">goal ${big(goalV)}</text>`:`<text x="${W-R}" y="${T+10}" text-anchor="end" style="fill:var(--bad)">goal ${big(goalV)} is off this scale</text>`}
  <circle cx="${x(f.length-1)}" cy="${y(f[f.length-1].p50)}" r="3.5" fill="var(--accent)"/>
  ${yrs.map(([i,d])=>`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${d.slice(0,4)}</text>`).join("")}
  </svg></div>`;
}

function model(){
  const al=D.allocation,bt=(D.validation||{}).backtest||{},vd=(D.validation||{}).verdict||[];
  const mrow=D.macro.map(m=>{const s=m.signal,w=isNum(s)?Math.abs(s)*50:0;return `<div class="drv"><span class="small">${esc(m.key)} <span class="muted">${esc(m.series)} · ${isNum(m.value)&&m.available?m.value.toFixed(2):"n/a"} · ${esc(m.obs_date||"")}</span></span>
  <div class="score"><span class="mid"></span>${isNum(s)?`<span class="fill" style="left:${s<0?50-w:50}%;width:${w}%;background:${s<0?"var(--bad)":"var(--good)"}"></span>`:""}</div><span class="num small">${isNum(s)?sgn(s):"n/a"}</span></div>`}).join("");
  $("#view").innerHTML=`
  <section><div class="eyebrow">Allocation</div><div class="card">
    <div><strong>Target risk-asset share ${pct(al.target_risk)}</strong></div>
    <div class="small">${al.parts.map(p=>`<div class="drv"><span>${esc(p[0])}</span><span></span><span class="num">${p[1]>=0&&p!==al.parts[0]?"+":""}${pct(p[1],1)}</span></div>`).join("")}</div>
    <div class="small muted">Macro score ${sgn(al.macro_score)} from ${pct(al.macro_coverage)} fresh data. Macro shifts allocation only and is capped, because macro timing has weak out-of-sample evidence (Welch & Goyal 2008).</div>
    ${mrow}</div></section>
  <section><div class="eyebrow">Does the model work? (backtest)</div><div class="card">
    ${vd.map(v=>`<div><strong>${esc(v)}</strong></div>`).join("")}
    ${bt.available?equityChart(bt)+`<div class="tbl"><table><tr><th>Strategy</th><th>CAGR</th><th>Sharpe</th><th>Worst drop</th><th>Test CAGR</th><th>Test Sharpe</th></tr>
    ${bt.results.map(r=>`<tr><td>${esc(r.strategy)}</td><td class="num">${pct(r.full.cagr,1)}</td><td class="num">${isNum(r.full.sharpe)?r.full.sharpe.toFixed(2):"–"}</td><td class="num">${pct(r.full.max_dd)}</td><td class="num">${pct(r.test.cagr,1)}</td><td class="num">${isNum(r.test.sharpe)?r.test.sharpe.toFixed(2):"–"}</td></tr>`).join("")}</table></div>
    <div class="small muted">${esc(bt.start)} to ${esc(bt.end)}; test period from ${esc(bt.split)}. Monthly rebalancing, ${D.params.bt_cost_bps} bp costs per side, ETFs only. Survivorship bias and revised macro data make these results optimistic; see the workbook's Validation sheet.</div>`:`<div class="small">${esc(bt.reason||"Not available")}</div>`}
  </div></section>
  <section><div class="eyebrow">Configuration</div><div class="card small">
    <div><strong>Active model v${D.run.config_version}</strong> <span class="muted">(${esc(D.run.config_created)})</span></div>
    <div>${esc(D.run.config_reason)}</div>
    <div class="muted">To change assumptions, edit the yellow cells in the model workbook and upload it to the repo's inbox folder. Invalid values are rejected with the reason; nothing changes until a file validates.</div>
  </div></section>`;
}
function equityChart(bt){
  const keys=["Benchmark buy & hold","Static policy (benchmark + defensive)","Model + trend + macro (full)","Legacy 2025 scanner (top-k)"];
  const cols=["var(--muted)","var(--info)","var(--accent)","var(--warn)"];
  const S=keys.map(k=>bt.curves[k]||[]);const n=Math.max(...S.map(s=>s.length));if(n<2)return"";
  const W=640,H=220,L=40,R=10,T=10,B=22;const all=S.flat().map(p=>p[1]);
  const lo=Math.log(Math.min(...all)),hi=Math.log(Math.max(...all));
  const x=i=>L+(W-L-R)*i/(n-1),y=v=>T+(H-T-B)*(1-(Math.log(v)-lo)/(hi-lo||1));
  const grid=[1,2,4,8].filter(v=>Math.log(v)>=lo&&Math.log(v)<=hi);
  const yrs=S[0].map((p,i)=>[i,p[0]]).filter(([i,d])=>d.slice(5,7)==="12"&&(+d.slice(0,4))%4===0);
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Growth of 1 unit, log scale">
  ${grid.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}×</text>`).join("")}
  ${S.map((s,j)=>`<polyline points="${s.map((p,i)=>`${x(i+(n-s.length))},${y(p[1])}`).join(" ")}" fill="none" stroke="${cols[j]}" stroke-width="${j===2?2.4:1.5}"/>`).join("")}
  ${yrs.map(([i,d])=>`<text x="${x(i)}" y="${H-5}" text-anchor="middle">${d.slice(0,4)}</text>`).join("")}</svg></div>
  <div class="legend">${keys.map((k,j)=>`<span><i style="background:${cols[j]}"></i>${esc(k)}</span>`).join("")}</div>`;
}

  ${(fails.length?fails:src.slice(0,12)).map(s=>`<tr><td>${esc(s.kind)}</td><td>${esc(s.key)}</td><td>${esc(s.source||"–")}</td><td>${s.ok?(s.from_cache?"cached copy":"ok"):"failed"}</td></tr>`).join("")}</table></div>
  ${fails.length?`<div class="small muted">Showing only failed or cached sources.</div>`:`<div class="small muted">All sources fetched live; first 12 shown.</div>`}</div></section>
  <section><div class="eyebrow">Stale or missing</div><div class="card small">${[...D.health.stale.map(t=>t+" (stale)"),...D.health.missing.map(t=>t+" (missing)")].map(esc).join(", ")||"None"}</div></section>`;
}
boot().catch(e=>{$("#app").innerHTML=`<div class="card">The dashboard could not load: ${esc(e.message)}</div>`});
</script>
</body></html>
